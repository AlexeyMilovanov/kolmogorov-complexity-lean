# Continuous integration for the Kolmogorov complexity formalisation.
#
# Each check calls a named step of `scripts/ci_local.sh`, which also runs
# the same checks locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The declaration-header freeze compares against the base commit.
          fetch-depth: 0

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"

      - name: Report toolchain
        run: bash scripts/ci_local.sh toolchain

      - name: Cache the build output
        uses: actions/cache@v4
        with:
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
          path: |
            .lake/build
            .lake/packages

      - name: Fetch the Mathlib cache
        run: bash scripts/ci_local.sh cache

      - name: Build
        run: bash scripts/ci_local.sh build

      - name: Audit
        # forbidden constructs, `sorry` scan, generated tables, file size, the
        # mechanical-cut gate and its calibration, docstring coverage, the
        # build of every maximal root, the warning-count gate, the co-import
        # smoke test, the axiom sweep and the tactic smoke tests.
        run: bash scripts/ci_local.sh audit

      # The three test scripts run as steps of their own: `scripts/audit.sh`
      # calls only the calibration, and a red calibration must fail CI even if
      # someone removes that call from `audit.sh`.
      - name: Header-check self-test
        run: bash scripts/ci_local.sh headers-selftest

      - name: Mechanical-cut gate self-test
        run: bash scripts/ci_local.sh cut-quality-selftest

      - name: Mechanical-cut gate calibration
        run: bash scripts/ci_local.sh cut-quality-calibration

      - name: Declaration-header freeze check
        # Only meaningful on a pull request, where there is a base commit to
        # compare against. The local runner supplies the rename,
        # definition-merge and re-cut tables to preserve API compatibility.
        if: github.event_name == 'pull_request'
        env:
          BASE_REV: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bash scripts/ci_local.sh header-freeze

  docs:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Same three steps as the build job, in the same order: without elan
      # there is no `lake` on the runner and `lake exe cache get` cannot run.
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"

      - name: Report toolchain
        run: bash scripts/ci_local.sh toolchain

      - name: Cache the build output
        uses: actions/cache@v4
        with:
          # A key of its own: this job additionally holds `doc-gen4` and its
          # dependencies, and the documentation build itself.
          key: lake-docs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docbuild/lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-docs-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docbuild/lakefile.toml') }}-
            lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
          path: |
            .lake/build
            .lake/packages
            docbuild/.lake

      - name: Fetch the Mathlib cache
        run: bash scripts/ci_local.sh cache

      - name: Build the documentation
        # `doc-gen4` is required from the side package `docbuild/`, so that the
        # main build never depends on it.  `:docs` covers the imports too, so
        # this builds Mathlib's documentation as well: it is the long job.
        run: bash scripts/ci_local.sh docs

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docbuild/.lake/build/doc
