name = "kolmogorov_complexity"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["KolmogorovMathlib", "KolmogorovCounterexamples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"


[[lean_lib]]
name = "KolmogorovMathlib"
# Preserve the library's pre-module public visibility while consuming module-enabled Mathlib.
allowNonModules = true

[[lean_lib]]
name = "KolmogorovCounterexamples"
# Counterexamples intentionally share the same legacy visibility convention.
allowNonModules = true
